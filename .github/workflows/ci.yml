# Intentionally NO bench job: bench/tests require the local graft daemon +
# embedding cache (~/.heimdall), which GitHub runners don't have.
# Run `mise run bench-test` locally instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      - run: npm run typecheck

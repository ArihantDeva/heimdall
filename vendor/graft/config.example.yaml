# =============================================================================
# graft configuration — fully annotated example
# =============================================================================
# Every key below maps 1:1 to a field parsed by src/config/config.c. Defaults
# shown match mg_config_defaults(); commenting a key out restores its default.
# Tags used in comments:
#   [security]   — affects who can read/write your memory graph
#   [perf]       — affects latency / RAM / GPU usage
#   [quality]    — affects retrieval/classification result quality
#   [range]      — sensible bounds; values outside are accepted but degrade
# =============================================================================


# -----------------------------------------------------------------------------
# daemon — IPC + persistent store
# -----------------------------------------------------------------------------
daemon:
  # [security] AF_UNIX socket used by `graft` CLI and integration hooks to talk
  # to the daemon. The daemon now creates this with mode 0600 (POSIX), but the
  # *parent directory* must also be writable only by you. /tmp on a shared host
  # is fine because of the mode bits, but prefer $XDG_RUNTIME_DIR ($HOME/.run)
  # on multi-user systems. On Windows this string is currently unused — the
  # daemon talks over a named pipe derived from the user profile.
  socket_path: "/tmp/graft.sock"

  # [security] SQLite database file. Contains EVERYTHING you have stored: node
  # titles, bodies, embeddings, edges, FTS5 indexes, usage history. Treat as
  # secret. The daemon forces mode 0600 on the file at open time (POSIX);
  # the parent directory must also be private to you. Relative paths are
  # resolved against the daemon's CWD, which is unpredictable in the install
  # flow — prefer an absolute path under $HOME/.graft (or $XDG_DATA_HOME/graft)
  # in production.
  #
  # Encryption-at-rest: set env GRAFT_DB_KEY before starting the daemon. When
  # set, the daemon executes `PRAGMA key='<value>'` on every connection. This
  # works ONLY if the linked sqlite is SQLCipher (see docs/SQLCIPHER.md); on
  # vanilla sqlite the PRAGMA is silently ignored and the daemon logs a loud
  # warning so you don't get false confidence. Unset the env var to keep the
  # legacy unencrypted behaviour.
  db_path: "./graft.db"


# -----------------------------------------------------------------------------
# embedding — local llama.cpp model used to vectorize text on every insert/query
# -----------------------------------------------------------------------------
embedding:
  # Path to the GGUF embedding model. bge-m3 (1024-dim, multilingual, 8192-tok)
  # is the reference choice. Swapping models REQUIRES wiping the db: existing
  # embeddings cannot be compared against vectors from a different model.
  model_path: "./models/bge-m3.gguf"

  # [perf] CPU threads for the llama backend. [range] 1..physical-cores.
  # Higher = lower embed latency until you saturate memory bandwidth (typical
  # sweet spot: physical cores, NOT logical/SMT). Ignored when hardware_accel
  # is true and the GPU offload covers all layers.
  threads: 4

  # [perf][quality] Max tokens passed to the embedder per call. [range]
  # 512..8192 for bge-m3. Lower = less RAM/VRAM and faster; longer inputs get
  # truncated, hurting recall for long documents. 8192 matches the model's
  # native context. Reducing below ~1024 will mangle multi-paragraph notes.
  ctx_size: 8192

  # [perf] Independent llama contexts sharing one model. >1 lets concurrent
  # requests (thread-per-connection) embed in parallel; each instance costs
  # ~ctx memory + one decode slot. 2-4 typical on multi-core hosts.
  instances: 1

  # [perf] Offload all layers to the GPU. Requires llama.cpp built with
  # -DGGML_CUDA=ON (NVIDIA) or -DGGML_HIP=ON (ROCm 6/7). 5-30x speedup on
  # embed-heavy workloads; falls back to CPU if no compatible GPU is found.
  hardware_accel: false


# -----------------------------------------------------------------------------
# verification — gating of cache hits during retrieval
# -----------------------------------------------------------------------------
# Determines whether a candidate becomes a STRONG hit, a WEAK hit, or NONE.
# See src/verify/verify.c for the exact gating logic. Tuning these is the
# single biggest lever on precision/recall tradeoff.
# -----------------------------------------------------------------------------
verification:
  # [perf][quality] Enable the GGUF cross-encoder reranker below. Adds ~20-200
  # ms per query depending on hardware but materially improves precision on
  # ambiguous matches. Off by default to keep first-run latency low.
  cross_encoder_enabled: false
  cross_encoder_model_path: "./models/bge-reranker-v2-m3.gguf"

  # [quality] Entailment-flavored second pass over the cross-encoder. When on,
  # the CE is invoked TWICE per pair: once with the default rerank template
  # (s_ce) and once with the entailment template below (s_nli). Doubles CE
  # cost per candidate but adds an independent signal for the reranker fusion.
  # Requires cross_encoder_enabled: true. Off by default.
  nli_enabled: false

  # Prompt template used when nli_enabled is true. `{document}` and `{query}`
  # are substituted with the candidate text and the query, respectively. The
  # model is the same as cross_encoder — the score is "relevance under an
  # entailment framing", not strict NLI entailment.
  nli_prompt_template: "Premise: {document}\nHypothesis: {query}"


  # [quality] Minimum s_vec required for the *lexical_strong* path in
  # src/verify/verify.c. The lexical_strong gate fires when trigram overlap is
  # high (>= strong_hit_min_lex) AND the embedding still agrees above this
  # floor. [range] 0..1. Lower = more lenient (accept lexically-matched results
  # even when the embedding is lukewarm); raising past ~0.8 effectively
  # disables the lexical path.
  lex_strong_min_vec: 0.7

  # [quality] Minimum s_vec required for the *semantic_strong* path. The
  # semantic_strong gate catches cross-language / paraphrased hits where the
  # embedding aligns strongly but trigram overlap is naturally low. [range]
  # 0..1. Raise to suppress vector-only false positives; lower to catch more
  # cross-language matches.
  sem_strong_min_vec: 0.75

  # [quality] Extra lexical margin (added to min_lex_overlap below) required
  # by the semantic_strong path. Protects against high-vector matches that
  # share zero tokens with the query. [range] 0..0.2. 0.015 keeps a token of
  # overlap as a sanity check without blocking truly cross-language hits.
  sem_strong_lex_margin: 0.015

  # [quality] Alternative gate that decides STRONG/WEAK/NONE from the fused
  # rerank score instead of the boolean lex/sem rules above. When true, the
  # rerank weights (rerank.w_vec/w_lex/w_ce/w_nli) are reused to compute a
  # weighted score and the thresholds below determine the hit level. Lets you
  # express hit-level decisions with a single continuous knob per band. Legacy
  # boolean rules remain the safe default.
  use_fused_gate: false

  # [quality] Fused-score floor for STRONG hits when use_fused_gate is true.
  # [range] 0..1. Higher = stricter precision, fewer cache hits.
  strong_min_fused: 0.70

  # [quality] Fused-score floor for WEAK hits when use_fused_gate is true.
  # [range] 0..1. Must be < strong_min_fused. Sets the floor below which a
  # match is dropped to MG_HIT_NONE.
  weak_min_fused: 0.50



# -----------------------------------------------------------------------------
# cache — thresholds for STRONG vs WEAK vs NONE classification
# -----------------------------------------------------------------------------
# A candidate becomes:
#   STRONG  if  (CE-enabled => s_ce >= strong_hit_min_ce)
#               AND (
#                 lexical_strong: s_lex >= strong_hit_min_lex AND s_vec >= 0.70
#                 OR
#                 semantic_strong: s_vec >= 0.75 AND s_lex >= min_lex_overlap+0.015
#               )
#   WEAK    if  NOT STRONG AND s_vec >= weak_hit_min_vec AND s_lex >= min_lex_overlap
#   NONE    otherwise
# Higher thresholds => fewer false positives, more cache misses.
# Lower thresholds  => more cache hits, more wrong answers.
# -----------------------------------------------------------------------------
cache:
  # [quality] Cross-encoder score floor for STRONG hits. [range] 0.0..1.0.
  # Only consulted when verification.cross_encoder_enabled is true. 0.6 is
  # bge-reranker-v2-m3's typical "clearly relevant" boundary.
  strong_hit_min_ce: 0.6

  # [quality] Lexical (trigram Jaccard) floor for the lexical_strong path.
  # [range] 0.05..0.4. 0.15 corresponds to substantial token overlap; raising
  # to 0.25+ cuts cross-language hits entirely.
  strong_hit_min_lex: 0.15

  # [quality] Cosine-similarity floor for WEAK hits. [range] 0.70..0.95.
  # 0.85 is conservative for bge-m3; 0.80 will surface more loose matches at
  # the cost of off-topic results.
  weak_hit_min_vec: 0.85

  # [quality] Hard lexical floor applied to BOTH paths. [range] 0.0..0.2.
  # Set higher (0.1-0.15) to suppress vector-only false positives in
  # multilingual contexts where embedding alignment can be deceptive.
  min_lex_overlap: 0.05


# -----------------------------------------------------------------------------
# retrieval — candidate counts during search
# -----------------------------------------------------------------------------
retrieval:
  # [perf][quality] Default number of candidates returned by /v1/search and
  # `graft query`. [range] 5..100. Higher = better recall but more verify
  # work (each candidate runs through cache gating + optional CE).
  top_k: 25

  # [quality] Reciprocal-Rank-Fusion constant in src/retrieve/retrieve.c.
  # [range] 30..100. 60 is the canonical value from Cormack et al. (2009);
  # lower flattens the rank-weight curve, higher gives top-ranked sources more
  # influence. Almost never worth tuning.
  rrf_k_const: 60

  # [perf] Cap on the secondary "fallback_retrieve" pass that fires when a
  # cache-MISS query needs to surface SOMETHING. [range] 1..top_k. Kept low to
  # avoid drowning the user in marginal matches during exploration.
  query_fallback_top_k: 5


# -----------------------------------------------------------------------------
# rerank — second-stage reranker on top of RRF retrieval
# -----------------------------------------------------------------------------
# When enabled, the top-K RRF candidates are re-scored using a weighted fusion
# of cosine (s_vec), trigram Jaccard (s_lex), cross-encoder probability (s_ce),
# and the entailment-flavored CE signal (s_nli). The fusion is:
#   fused = sum(w_i * s_i) / sum(w_i)   over signals that are not NaN
# Signals that are NaN (CE/NLI disabled, etc.) are dropped from numerator AND
# denominator. Candidates outside the rerank window keep their RRF rank.
# When `enabled: false` the retrieval pipeline is bit-for-bit unchanged.
# -----------------------------------------------------------------------------
rerank:
  # [quality] Master switch. When false, retrieve.c output stays RRF-ordered
  # as before. When true and verification.cross_encoder_enabled is also true,
  # adds a CE forward pass per candidate (sequential — see notes in
  # src/rerank/rerank.c). Leave off until you have a CE model loaded.
  enabled: false

  # [perf][quality] How many of the top RRF candidates to actually rerank.
  # [range] 5..top_k. Reranking is O(top_k) CE forward passes, so this is the
  # single biggest knob on rerank latency. Candidates outside this window keep
  # their RRF order unchanged.
  top_k: 25

  # [quality] Weight on vector cosine (already [0,1]). [range] 0..1. Raising
  # makes the reranker trust the embedder more; lowering shifts trust to
  # lexical/CE signals.
  w_vec: 0.30

  # [quality] Weight on lexical trigram Jaccard. [range] 0..1. Jaccard's
  # practical range is ~[0,0.5] so this weight is implicitly boosted relative
  # to a uniform-distribution signal — a value of 0.25 here is roughly
  # comparable to 0.5 on a [0,1]-spread signal.
  w_lex: 0.25

  # [quality] Weight on the cross-encoder probability. [range] 0..1. The most
  # informative signal when CE is enabled; ignored entirely when CE is off
  # (signal is NaN and excluded from the weighted average).
  w_ce:  0.45

  # [quality] Weight on the entailment-flavored CE signal (s_nli). Only
  # contributes when verification.nli_enabled AND verification.cross_encoder_
  # enabled are both true; otherwise NaN and excluded. NOTE: enabling this
  # roughly doubles the per-candidate CE latency. [range] 0..1.
  w_nli: 0.0



# -----------------------------------------------------------------------------
# edges — graph wiring done at insert time
# -----------------------------------------------------------------------------
# Every new node is linked to existing nodes via two edge kinds:
#   KEYWORD edges — shared classifier tags / extracted keywords
#   SEMANTIC edges — high cosine similarity in embedding space
# Thresholds below decide which neighbors are linked; the topk caps the
# fan-out so the graph stays sparse.
# -----------------------------------------------------------------------------
edges:
  # [quality] Minimum keyword-edge score to keep a candidate. [range] 0.3..0.8.
  # Lower = denser graph, better recall on tag-driven queries. Higher = sparser
  # graph, faster /v1/explore.
  edge_keyword_min: 0.5

  # [quality] Minimum semantic-edge score (cosine-derived) to keep a candidate.
  # [range] 0.5..0.85. Below 0.5 you start linking near-unrelated nodes.
  edge_semantic_min: 0.6

  # [perf][quality] Max keyword edges emitted per inserted node. [range] 2..20.
  # Higher = richer graph + bigger storage + slower explore.
  edge_keyword_topk: 5

  # [perf][quality] Max semantic edges per inserted node. [range] 5..50.
  edge_semantic_topk: 20

  # [quality] MMR redundancy penalty when selecting which edges to keep.
  # [range] 0.0..1.0. 0 = pure score (cluster-heavy edges); 1 = pure diversity.
  # Also reused inside /v1/explore beam selection. 0.7 is a good neutral.
  mmr_lambda: 0.7


# -----------------------------------------------------------------------------
# explore — keyword-conditioned beam search over the graph (/v1/explore)
# -----------------------------------------------------------------------------
# Beam search expands `beam` paths per step for `depth` steps, scoring each
# expansion as base + alpha*log(sem) - depth_penalty*step - lambda*redundancy.
# See the header comment in src/explore/explore.c for the full formula.
# -----------------------------------------------------------------------------
explore:
  # [perf] Beams kept per step. [range] 1..16. Doubling beam roughly doubles
  # latency and memory; gains plateau quickly past 8 for most graphs.
  default_beam: 4

  # [perf] Number of expansion hops from each seed. [range] 1..6. Above 5
  # the search tends to drift even with the depth penalty.
  default_depth: 3

  # [quality] Per-step depth penalty base. [range] (0, 1]. Stored clamped to
  # (eps, 1]. The penalty is computed from log(decay_gamma); LOWER values
  # mean a HEAVIER penalty (so deeper paths must be much stronger to compete
  # with shallow ones). 0.85 ≈ moderate; 0.6 keeps the search shallow; 0.95
  # lets the beam roam.
  decay_gamma: 0.85

  # [quality] Weight on the semantic-score component vs the edge-weight
  # component when scoring expansions. [range] 0.0..2.0. Set near 0 to follow
  # graph topology and ignore embeddings; 1+ to prioritize semantic
  # similarity over established graph links.
  alpha: 0.5


# -----------------------------------------------------------------------------
# http — optional REST + viewer SPA  [security-sensitive]
# -----------------------------------------------------------------------------
# Off by default. Once enabled, ANY process able to reach `bind:port` can call
# /v1/* with NO authentication. Defense in depth:
#   1. Keep `bind: 127.0.0.1` (or `::1`) — the daemon now refuses non-loopback
#      addresses unless allow_remote is true.
#   2. Disable write endpoints (insert/delete) you do not need.
#   3. Put integrations/mcp-server/oauth_gateway.py in front for OAuth/OIDC if
#      you need network exposure.
#   4. The Host header is also validated server-side to block DNS-rebinding
#      attacks against the loopback binding.
# -----------------------------------------------------------------------------
http:
  # [security] Master switch. When false, no TCP listener is created.
  enabled: false

  # [security] Listen address. Anything other than 127.0.0.0/8, ::1, or
  # "localhost" is REFUSED at startup unless allow_remote: true (below).
  bind: "127.0.0.1"

  # TCP port. Pick something not in use; 9977 is the project default.
  port: 9977

  # [security] OPT-IN required to bind a non-loopback address. When true,
  # the daemon enforces a second check at startup: at least ONE of
  # (auth_token non-empty, tls_terminated_externally: true) MUST hold,
  # otherwise startup is refused. This makes an accidentally-exposed
  # plaintext unauthenticated daemon impossible without flipping both
  # safety rails off explicitly.
  allow_remote: false

  # [security] Operator attestation that a TLS-terminating reverse proxy
  # (caddy / nginx / stunnel / cloudflared) is in front of the daemon. The
  # daemon itself does NOT speak TLS — native TLS is on the roadmap. When
  # you put a proxy in front (e.g., to expose graft on a LAN with HTTPS),
  # flip this to true to satisfy the allow_remote gate. Leave false otherwise.
  tls_terminated_externally: false

  # [security] Bearer token (full access). When non-empty, every /v1/* request
  # MUST carry `Authorization: Bearer <token>` or get 401. Constant-time
  # compared to avoid timing oracles. Env GRAFT_HTTP_AUTH_TOKEN overrides
  # this field so secrets can stay out of YAML. The static SPA at / is NOT
  # auth-gated (viewer JS must inject the token when fetching /v1/*).
  # LEAVE EMPTY to disable auth entirely (legacy no-auth behaviour, fine for
  # localhost-only deployments).
  auth_token: ""

  # [security] Optional second token with READ-ONLY scope. Holders can call
  # GET endpoints (match/search/explore/classify/view/nodes) but POST/DELETE
  # mutations return 403. Useful for handing out a "viewer-only" credential
  # without giving the viewer the ability to write or delete. Set both this
  # AND auth_token to enable two-tier access; set only one (or neither) for
  # single-token or no-auth mode.
  readonly_token: ""

  # [security] When true, the CSRF Origin/Referer check is enforced on /v1/*
  # writes only when an auth token is set (config above). Browsers always
  # send Origin on cross-origin requests; non-browser clients (curl, daemon-
  # to-daemon) are not penalized. This protects against XSS on the SPA
  # injecting a stolen token from a different origin into a write. The flag
  # itself has no toggle here — CSRF is tied to auth being on. When you
  # disable auth (empty tokens), CSRF protection is off too, by design.

  # [security] When true, /v1/view strips titles and primary_keyword from the
  # response so the dump is graph TOPOLOGY only — coordinates, ids, edges,
  # state, body_len. Useful for sharing a graph layout publicly without
  # leaking what the nodes ARE. The viewer SPA still renders shapes/edges,
  # just without readable labels. Off by default.
  view_anonymize: false

  # [security] RBAC-lite scope for /v1/view. When set to a keyword name, the
  # endpoint returns ONLY nodes tagged with that keyword (and edges where
  # BOTH endpoints are in scope). Lets you publish a curated subgraph (e.g.,
  # keyword "public") without exposing private nodes. Empty/missing = full
  # graph dump (legacy). Combine with view_anonymize for topology-only
  # sharing of a scoped subset.
  view_keyword_scope: ""

  # Per-endpoint toggles. Disable anything you do not actively use.
  endpoint_match:    true       # GET    /v1/match     — cache-hit probe (read)
  endpoint_search:   true       # GET    /v1/search    — full search (read)
  endpoint_explore:  true       # GET    /v1/explore   — beam search (read)
  endpoint_classify: true       # GET    /v1/classify  — keyword classify (read)
  endpoint_insert:   true       # POST   /v1/insert    — WRITE: adds nodes/edges
  endpoint_delete:   false      # DELETE /v1/nodes/{id}— WRITE: removes nodes
  endpoint_view:     true       # GET    /v1/view      — dumps the WHOLE graph

  # Filesystem path of the viewer SPA bundle served at /. Relative paths
  # resolve against the daemon's CWD; use an absolute path in production. The
  # server enforces a path-traversal whitelist (/, /index.html, /favicon.ico,
  # /assets/*) so files outside this directory are NOT exposed.
  viewer_path: "viewer/dist"
